<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú Interno · Landea</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --border:#e2e4e9;
    --text:#1c1e21;
    --muted:#6b7280;
    --accent:#8a6d3b;
    --accent-bg:#f6efe4;
    --pending:#c0392b;
    --pending-bg:#fdecea;
    --locked-bg:#eceff1;
    --locked-text:#78838c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  header{
    max-width:1100px;
    margin:0 auto 28px auto;
  }
  header h1{
    font-size:22px;
    margin:0 0 4px 0;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  header a.site-link{
    color:var(--accent);
    text-decoration:none;
    font-size:13px;
  }
  main{
    max-width:1100px;
    margin:0 auto;
  }
  section.desarrollo{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:18px;
  }
  section.desarrollo h2{
    font-size:16px;
    margin:0 0 4px 0;
  }
  section.desarrollo .sub{
    font-size:12px;
    color:var(--muted);
    margin:0 0 14px 0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:12px;
  }
  .card{
    display:block;
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    text-decoration:none;
    color:var(--text);
    background:#fbfbfc;
    transition:border-color .15s,transform .1s;
  }
  a.card:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
  }
  .card .icon{
    font-size:22px;
    margin-bottom:8px;
    display:block;
  }
  .card .modelo{
    font-weight:600;
    font-size:14px;
    display:block;
  }
  .card .nombre{
    font-size:12px;
    color:var(--muted);
    display:block;
    margin-top:2px;
  }
  .card .badge{
    display:inline-block;
    margin-top:8px;
    font-size:10px;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:20px;
  }
  .card.pending .badge{
    background:var(--pending-bg);
    color:var(--pending);
  }
  .card.ready .badge{
    background:var(--accent-bg);
    color:var(--accent);
  }
  .card.pending{
    cursor:default;
    opacity:.85;
  }
  .proximamente-grid .card{
    background:var(--locked-bg);
    color:var(--locked-text);
    position:relative;
  }
  .proximamente-grid .card.locked .badge{
    background:#dfe3e6;
    color:var(--locked-text);
  }
  .icon-logo{
    height:64px;
    width:64px;
    object-fit:contain;
    display:block;
    margin-bottom:8px;
  }
  .proximamente-grid .card.locked .icon-logo{
    filter:grayscale(1);
    opacity:.55;
  }
  .lock-badge{
    position:absolute;
    top:10px;
    right:10px;
    font-size:14px;
  }
  footer{
    max-width:1100px;
    margin:24px auto 0 auto;
    font-size:12px;
    color:var(--muted);
  }
  header{
    display:flex;
    align-items:center;
    gap:16px;
  }
  header .brand-logo{
    height:56px;
    width:56px;
    object-fit:contain;
    flex-shrink:0;
  }
  .dev-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .dev-logo{
    height:96px;
    width:96px;
    object-fit:contain;
    flex-shrink:0;
  }
</style>
</head>
<body>

<header>
  <img class="brand-logo" src="logo-castdim.png" alt="Castdim">
  <div>
    <h1>Menú interno de propiedades</h1>
    <p>Landea &middot; uso interno &middot; da clic en cada casa/modelo para abrir su página.
      <a class="site-link" href="https://landea.com.mx/" target="_blank" rel="noopener">landea.com.mx ↗</a>
    </p>
  </div>
</header>

<main id="app"></main>

<footer>
  Los modelos marcados como <strong>"falta link"</strong> aún no tienen página asignada.
  Actualiza el arreglo <code>DATA</code> al inicio del script con los links conforme se vayan generando.
</footer>

<script>
/* =========================================================
   EDITA AQUÍ: agrega el link (href) conforme lo vayas teniendo.
   Deja "" (vacío) si todavía no existe la página.
   ========================================================= */
const DATA = [
  {
    desarrollo: "Terram",
    logo: "logo-terram.png",
    items: [
      { modelo: "Beirut",   nombre: "Terram Beirut",   href: "" },
      { modelo: "Marsella", nombre: "Terram Marsella", href: "" },
      { modelo: "Estambul", nombre: "Terram Estambul", href: "" },
      { modelo: "Trípoli",  nombre: "Terram Trípoli",  href: "https://landea.com.mx/Terram-Tripoli/" },
      { modelo: "Terrenos", nombre: "Terram Terrenos", href: "" },
    ]
  },
  {
    desarrollo: "Sotavento Residencial",
    logo: "logo-sotavento.png",
    items: [
      { modelo: "Fragata",              nombre: "Sotavento Fragata",              href: "https://landea.com.mx/SOTAVENTO/Fragata/" },
      { modelo: "Bita",                 nombre: "Sotavento Bita",                 href: "https://landea.com.mx/SOTAVENTO/Bita/" },
      { modelo: "Estambul",             nombre: "Sotavento Estambul",             href: "" },
      { modelo: "Amuras",               nombre: "Sotavento Amuras",               href: "https://landea.com.mx/SOTAVENTO/Amuras/" },
      { modelo: "Baliza",               nombre: "Sotavento Baliza",               href: "" },
      { modelo: "Landa",                nombre: "Sotavento Landa",                href: "https://landea.com.mx/sotavento-landa/" },
      { modelo: "Terrenos Comerciales", nombre: "Sotavento Terrenos Comerciales", href: "" },
    ]
  },
  {
    desarrollo: "Avante (Departamentos)",
    logo: "logo-avante.png",
    items: [
      { modelo: "Capri", nombre: "Avante Capri", href: "" },
      { modelo: "Malta", nombre: "Avante Malta", href: "https://landea.com.mx/avante-malta/" },
    ]
  },
  {
    desarrollo: "Lanka",
    logo: "logo-lanka.png",
    items: [
      { modelo: "Azurita A", nombre: "Lanka Azurita A", href: "" },
      { modelo: "Azurita B", nombre: "Lanka Azurita B", href: "" },
      { modelo: "Azurita C", nombre: "Lanka Azurita C", href: "https://landea.com.mx/lanka-azurita-c/" },
      { modelo: "Granate A", nombre: "Lanka Granate A", href: "" },
      { modelo: "Granate B", nombre: "Lanka Granate B", href: "" },
      { modelo: "Granate C", nombre: "Lanka Granate C", href: "" },
    ]
  },
  {
    desarrollo: "Ankara",
    logo: "LOGO%20ANKARA.png",
    items: [
      { modelo: "Onix",     nombre: "Ankara Onix",     href: "https://landea.com.mx/ankara/ankara-onix/" },
      { modelo: "Ágata",    nombre: "Ankara Ágata",    href: "https://landea.com.mx/ankara/ankara-agata/" },
      { modelo: "Onix 3P",  nombre: "Ankara Onix 3P",  href: "https://landea.com.mx/ankara/ankara-onix-3p/" },
    ]
  },
];

const PROXIMAMENTE = [
  { nombre: "Torre Tolosa II", logo: "logo-torretolosa.png", locked: true },
  { nombre: "Novara",          logo: null,                   locked: false },
];

function cardHTML(item){
  const hasLink = !!item.href;
  const tag = hasLink ? "a" : "div";
  const hrefAttr = hasLink ? `href="${item.href}" target="_blank" rel="noopener"` : "";
  const cls = hasLink ? "card ready" : "card pending";
  const badge = hasLink ? "" : `<span class="badge">Falta link</span>`;
  return `
    <${tag} class="${cls}" ${hrefAttr}>
      <span class="icon">🏠</span>
      <span class="modelo">${item.modelo}</span>
      <span class="nombre">${item.nombre}</span>
      ${badge}
    </${tag}>`;
}

function proximaCardHTML(p){
  const icon = p.logo
    ? `<img class="icon-logo" src="${p.logo}" alt="${p.nombre}">`
    : `<span class="icon">🏗️</span>`;
  return `
    <div class="card ${p.locked ? "locked" : ""}">
      ${p.locked ? `<span class="lock-badge">🔒</span>` : ""}
      ${icon}
      <span class="modelo">${p.nombre}</span>
      <span class="badge">Próximamente</span>
    </div>`;
}

const app = document.getElementById("app");

app.innerHTML = DATA.map(dev => `
  <section class="desarrollo">
    <div class="dev-header">
      <img class="dev-logo" src="${dev.logo}" alt="${dev.desarrollo}">
      <p class="sub">${dev.items.length} modelo(s)</p>
    </div>
    <div class="grid">
      ${dev.items.map(cardHTML).join("")}
    </div>
  </section>
`).join("") + `
  <section class="desarrollo">
    <h2>Próximos proyectos</h2>
    <p class="sub">Aún sin modelos publicados</p>
    <div class="grid proximamente-grid">
      ${PROXIMAMENTE.map(proximaCardHTML).join("")}
    </div>
  </section>
`;
</script>

</body>
</html>
